<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock View · Antigravity Pro</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:linear-gradient(180deg,#070a10 0%,#0b1018 46%,#070a10 100%); color:var(--text); font-family:var(--font-ui); overflow:hidden; }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; background:linear-gradient(90deg,rgba(58,208,224,.05),transparent 28%,rgba(255,194,75,.04) 64%,transparent), repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 80px); }
  a{ color:var(--blue); }
  .app{ height:100vh; display:grid; grid-template-rows:auto 1fr; position:relative; }
  .top{ display:grid; grid-template-columns:minmax(220px,1fr) minmax(300px,520px) minmax(160px,1fr); gap:14px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--border); background:rgba(13,20,32,.86); backdrop-filter:blur(14px); }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .mark{ width:30px; height:30px; border-radius:7px; display:grid; place-items:center; color:#071018; background:linear-gradient(135deg,var(--cyan),var(--amber)); font-weight:900; font-family:var(--font-num); }
  .ttl{ font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--text); font-size:.86rem; }
  .subttl{ color:var(--muted); font-size:.74rem; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .search{ display:grid; grid-template-columns:1fr auto; gap:8px; position:relative; }
  .search input{ width:100%; background:#090f18; border:1px solid var(--border2); color:var(--text); border-radius:6px; padding:9px 12px; font-size:.93rem; font-family:inherit; }
  .search input:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(58,208,224,.12); }
  .search button{ background:var(--text); border:0; color:#071018; font-weight:900; border-radius:6px; padding:8px 15px; font-size:.86rem; cursor:pointer; }
  .stale{ justify-self:end; font-size:.78rem; color:var(--muted); font-family:var(--font-num); }
  .ac{ position:absolute; top:calc(100% + 6px); left:0; right:52px; max-height:360px; overflow-y:auto; background:#0a111b; border:1px solid var(--border2); border-radius:8px; box-shadow:0 18px 60px rgba(0,0,0,.62); z-index:9500; display:none; }
  .ac.on{ display:block; }
  .ac-i{ display:grid; grid-template-columns:96px 1fr auto auto; gap:9px; align-items:center; padding:8px 11px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,.045); }
  .ac-i:last-child{ border-bottom:0; }
  .ac-i:hover,.ac-i.sel{ background:rgba(58,208,224,.10); }
  .ac-s{ font-weight:900; font-size:.84rem; color:var(--cyan); font-family:var(--font-num); }
  .ac-n{ font-size:.8rem; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ac-e{ font-size:.68rem; color:var(--muted); font-weight:800; }
  .ac-fo{ font-size:.62rem; font-weight:900; padding:1px 5px; border-radius:4px; background:var(--green-dim); color:var(--green); border:1px solid var(--green-line); }
  .ac-more,.ac-none{ padding:10px 12px; font-size:.76rem; color:var(--muted); text-align:center; }
  .workspace{ min-height:0; display:grid; grid-template-rows:auto auto 1fr; }
  .hd{ display:grid; grid-template-columns:minmax(280px,1.2fr) auto minmax(340px,.95fr); gap:18px; align-items:stretch; padding:16px 18px 12px; border-bottom:1px solid rgba(255,255,255,.045); }
  .identity{ min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .eyebrow{ color:var(--muted); font-size:.72rem; font-weight:900; text-transform:uppercase; letter-spacing:.14em; }
  .nm{ margin-top:3px; font-size:1.68rem; font-weight:950; line-height:1.05; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub{ margin-top:5px; font-size:.86rem; color:var(--muted); font-weight:650; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .quoteBox{ min-width:220px; padding:12px 16px; border-left:1px solid var(--border); border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:center; align-items:flex-end; }
  .px{ font-size:2rem; font-weight:950; font-family:var(--font-num); line-height:1; }
  .chg{ margin-top:7px; font-size:.94rem; font-weight:900; font-family:var(--font-num); }
  .up{ color:var(--green); } .dn{ color:var(--red); } .flat{ color:var(--muted); }
  .bars{ display:grid; gap:9px; align-content:center; }
  .bar{ min-width:0; }
  .bar .bl{ display:flex; justify-content:space-between; gap:8px; font-size:.72rem; color:var(--muted); font-family:var(--font-num); margin-bottom:4px; }
  .bar .tr{ height:8px; background:#09101a; border-radius:99px; position:relative; border:1px solid var(--border); overflow:hidden; }
  .bar .tr::before{ content:""; position:absolute; inset:0; background:linear-gradient(90deg,var(--red),var(--amber),var(--green)); opacity:.25; }
  .bar .dot{ position:absolute; top:50%; width:11px; height:11px; border-radius:50%; background:var(--text); transform:translate(-50%,-50%); box-shadow:0 0 0 3px #09101a; }
  .bar .cap{ font-size:.68rem; color:var(--dim); margin-top:4px; }
  .tabs{ display:flex; gap:6px; padding:10px 18px; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tabs button{ flex:0 0 auto; background:#0a111b; border:1px solid var(--border); color:var(--muted); font-family:inherit; font-size:.82rem; font-weight:850; padding:7px 12px; cursor:pointer; border-radius:6px; }
  .tabs button:hover{ color:var(--text); border-color:var(--border2); }
  .tabs button.on{ color:#071018; background:var(--cyan); border-color:var(--cyan); }
  .body{ min-height:0; padding:12px 18px 16px; overflow-y:auto; }
  .cols{ display:grid; gap:12px; align-items:start; }
  .c3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
  .c2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .card{ background:rgba(13,20,32,.78); border:1px solid var(--border); border-radius:7px; padding:12px; box-shadow:0 10px 30px rgba(0,0,0,.16); min-width:0; }
  .card h3{ margin:0 0 9px; font-size:.76rem; font-weight:950; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:7px; }
  .card h3::before{ content:""; width:7px; height:7px; border-radius:2px; background:var(--cyan); opacity:.9; }
  .card h3 .tag{ margin-left:auto; font-size:.64rem; font-weight:850; letter-spacing:0; text-transform:none; padding:2px 6px; border-radius:4px; background:#09101a; color:var(--muted); border:1px solid var(--border); }
  .kv{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 12px; font-size:.84rem; }
  .kv .k{ color:var(--muted); font-weight:650; padding:2px 0; min-width:0; }
  .kv .v{ font-family:var(--font-num); font-weight:800; text-align:right; padding:2px 0; }
  .kv .v.na{ color:var(--faint); font-weight:650; font-family:var(--font-ui); font-size:.78rem; }
  table{ border-collapse:collapse; width:100%; font-size:.82rem; }
  th{ text-align:right; color:var(--muted); font-weight:850; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; padding:5px 6px; border-bottom:1px solid var(--border); white-space:nowrap; }
  th:first-child,td:first-child{ text-align:left; }
  td{ padding:6px; border-bottom:1px solid rgba(255,255,255,.045); font-family:var(--font-num); font-weight:760; text-align:right; }
  td:first-child{ font-family:var(--font-ui); color:var(--muted); font-weight:700; }
  .pill{ display:inline-flex; align-items:center; gap:4px; font-size:.72rem; font-weight:900; padding:2px 8px; border-radius:99px; border:1px solid var(--border); background:#09101a; white-space:nowrap; }
  .pill.up{ color:var(--green); border-color:var(--green-line); background:var(--green-dim); }
  .pill.dn{ color:var(--red); border-color:var(--red-line); background:var(--red-dim); }
  .pill.warn{ color:var(--amber); border-color:var(--amber-line); background:var(--amber-dim); }
  .prose{ font-size:.82rem; color:var(--muted); line-height:1.55; }
  .note{ font-size:.72rem; color:var(--dim); line-height:1.45; margin-top:7px; }
  .dist{ display:flex; height:18px; border-radius:5px; overflow:hidden; border:1px solid var(--border); background:#09101a; }
  .dist span{ display:block; font-size:.68rem; font-weight:900; color:#071018; text-align:center; line-height:18px; }
  .dlg{ display:flex; gap:10px; flex-wrap:wrap; margin-top:7px; font-size:.72rem; color:var(--muted); }
  .dlg i{ font-style:normal; width:8px; height:8px; border-radius:2px; display:inline-block; margin-right:4px; }
  .chips{ display:flex; gap:7px; flex-wrap:wrap; }
  .chip{ font-size:.8rem; font-weight:850; padding:5px 10px; border-radius:6px; cursor:pointer; background:#09101a; border:1px solid var(--border); color:var(--text); }
  .chip:hover{ border-color:var(--cyan); color:var(--cyan); }
  .banner{ border:1px solid var(--amber-line); background:var(--amber-dim); border-radius:7px; padding:9px 11px; font-size:.82rem; color:#f0dcae; line-height:1.5; margin-bottom:12px; }
  .banner b{ color:var(--amber); }
  .msg{ margin:34px auto; max-width:640px; padding:28px 18px; text-align:center; color:var(--muted); font-size:.93rem; border:1px dashed var(--border); border-radius:8px; background:rgba(13,20,32,.52); }
  .msg.err{ color:var(--red); border-color:var(--red-line); background:var(--red-dim); }
  .linkHero{ display:grid; grid-template-columns:minmax(280px,.8fr) minmax(420px,1.2fr); gap:12px; }
  .chainStats{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:10px; }
  .miniStat{ background:#09101a; border:1px solid var(--border); border-radius:6px; padding:9px; }
  .miniStat span{ display:block; color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; font-weight:850; }
  .miniStat b{ display:block; margin-top:4px; font-family:var(--font-num); font-size:1rem; }
  .network{ min-height:330px; position:relative; overflow:hidden; background:radial-gradient(circle at 50% 50%,rgba(58,208,224,.10),transparent 54%),#08101a; }
  .network svg{ width:100%; height:330px; display:block; }
  .node{ position:absolute; transform:translate(-50%,-50%); border:1px solid var(--border2); background:#0d1420; color:var(--text); border-radius:7px; padding:7px 9px; min-width:82px; text-align:center; cursor:pointer; box-shadow:0 10px 24px rgba(0,0,0,.35); }
  .node.main{ min-width:116px; border-color:var(--cyan); background:linear-gradient(180deg,#13283a,#0d1420); }
  .node b{ display:block; font-family:var(--font-num); font-size:.84rem; }
  .node span{ display:block; margin-top:2px; color:var(--muted); font-size:.66rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .node:hover{ border-color:var(--amber); }
  .linkList{ display:grid; gap:8px; }
  .linkRow{ display:grid; grid-template-columns:92px 1fr auto; gap:10px; align-items:center; padding:9px 10px; border:1px solid var(--border); background:#09101a; border-radius:6px; cursor:pointer; }
  .linkRow:hover{ border-color:var(--cyan); }
  .linkRow b{ font-family:var(--font-num); color:var(--cyan); }
  .linkRow span{ color:var(--muted); font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .linkRow em{ font-style:normal; color:var(--muted); font-size:.68rem; font-weight:850; text-transform:uppercase; letter-spacing:.06em; }
  .verifyGrid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
  .verifyBox{ border:1px solid var(--border); background:#09101a; border-radius:6px; padding:10px; min-width:0; }
  .verifyBox b{ display:block; margin-bottom:5px; font-size:.84rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .verifyBox span{ display:block; color:var(--muted); font-size:.74rem; line-height:1.35; }
  .verifyBox.ok{ border-color:var(--green-line); background:var(--green-dim); }
  .verifyBox.wait{ border-color:var(--amber-line); background:var(--amber-dim); }
  .verifyBox.no{ opacity:.76; }
  .verifyHead{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .verifyHead .score{ font-family:var(--font-num); font-size:1.9rem; font-weight:950; line-height:1; }
  .verifyHead .score small{ color:var(--muted); font-size:.78rem; font-family:var(--font-ui); font-weight:800; }
  .hlGrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .hlBox{ background:#09101a; border:1px solid var(--border); border-radius:7px; padding:11px; min-width:0; }
  .hlBox h4{ margin:0 0 9px; font-size:.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
  .hlRail{ position:relative; height:44px; margin:10px 0 7px; }
  .hlLine{ position:absolute; left:0; right:0; top:18px; height:8px; border:1px solid var(--border); border-radius:99px; background:linear-gradient(90deg,rgba(255,84,112,.22),rgba(255,194,75,.24),rgba(38,208,160,.22)); }
  .hlNow{ position:absolute; top:7px; width:3px; height:30px; border-radius:2px; background:var(--text); box-shadow:0 0 0 3px #09101a; transform:translateX(-50%); }
  .hlMark{ position:absolute; top:0; transform:translateX(-50%); font-size:.64rem; color:var(--muted); font-family:var(--font-num); }
  .hlMark.low{ left:0; transform:none; }
  .hlMark.high{ right:0; transform:none; }
  .hlMeta{ display:grid; grid-template-columns:1fr auto; gap:4px 8px; font-size:.78rem; }
  .hlMeta span{ color:var(--muted); }
  .hlMeta b{ font-family:var(--font-num); text-align:right; }
  .hlStatus{ margin-top:8px; font-size:.72rem; color:var(--muted); line-height:1.4; }
  .hlStatus.warn{ color:var(--amber); }
  .hidden{ display:none !important; }
  @media (max-width:1000px){
    body{ overflow:auto; }
    .app{ min-height:100vh; height:auto; }
    .top{ grid-template-columns:1fr; }
    .stale{ justify-self:start; }
    .hd,.linkHero{ grid-template-columns:1fr; }
    .quoteBox{ align-items:flex-start; border-left:0; border-right:0; border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:12px 0; }
    .c3,.c2{ grid-template-columns:1fr; }
    .verifyGrid{ grid-template-columns:1fr; }
    .hlGrid{ grid-template-columns:1fr; }
    .body{ overflow:visible; }
    .ac{ right:0; }
  }
  @media (min-width:1900px){
    .top{ grid-template-columns:minmax(260px,1fr) minmax(360px,620px) minmax(200px,1fr); }
    .body{ padding:14px 20px 18px; }
  }
</style>
</head>
<body>

<div class="app">
<div class="top">
  <div class="brand">
    <span class="mark">AG</span>
    <div>
      <div class="ttl">Stock Command</div>
      <div class="subttl">live quote, deep panels, linked stock chain</div>
    </div>
  </div>
  <form class="search" onsubmit="go(event)" role="combobox" aria-expanded="false" aria-haspopup="listbox">
    <input id="q" placeholder="Any listed stock — name or symbol" autocomplete="off"
           aria-autocomplete="list" aria-controls="ac">
    <button type="submit">Open</button>
    <div class="ac" id="ac" role="listbox" aria-label="Matching stocks"></div>
  </form>
  <span class="stale" id="stale"></span>
</div>

<div id="shell" class="workspace hidden">
  <div class="hd">
    <div class="identity">
      <div class="eyebrow">Active instrument</div>
      <div class="nm" id="nm">—</div>
      <div class="sub" id="sub">—</div>
    </div>
    <div class="quoteBox">
      <div class="px" id="px">—</div>
      <span class="chg" id="chg">—</span>
    </div>
    <div class="bars">
      <div class="bar" id="barDay"></div>
      <div class="bar" id="bar52"></div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button data-t="overview" class="on">Overview</button>
    <button data-t="highlow">High/Low Map</button>
    <button data-t="technical">Technical</button>
    <button data-t="fundamental">Fundamental</button>
    <button data-t="linked">Linked Chain</button>
    <button data-t="company">Company Inside</button>
    <button data-t="propicks">ProPicks</button>
    <button data-t="ownership">Ownership &amp; Analysts</button>
    <button data-t="news">News</button>
    <button data-t="gaps">Not available</button>
  </div>

  <div class="body" data-fit id="body"></div>
</div>

<div class="msg" id="msg">Type a stock above, or open this page as <code>/stock.html?q=TCS</code>.</div>
</div>

<script src="/js/rail.js"></script>
<script src="/js/fit.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   The full stock view — everything the vendor actually returns, plus a named
   list of what it does not.

   THE RULE THIS PAGE IS BUILT ON: a blank means "not reported". It never means
   zero. Every value below goes through n() or v(), which render an em dash for
   null and a real number for a real number — including a real zero. A dividend
   of 0 and a dividend that was never reported are different facts and they look
   different here.

   The panels this system cannot fill are not silently omitted. They are listed,
   with the reason, on the last tab — because nine panels shown where a broker
   shows sixteen invites the reader to assume the other seven were checked and
   found empty.
   ═══════════════════════════════════════════════════════════════════════════ */
const API = '';
const VALID_TABS = ['overview','highlow','technical','fundamental','linked','company','propicks','ownership','news','gaps'];
let DATA = null, TAB = VALID_TABS.includes(new URLSearchParams(location.search).get('tab')) ? new URLSearchParams(location.search).get('tab') : 'overview';

/* ── formatters. Every one of them treats null as "not reported". ─────────── */
const NA = '<span class="na">not reported</span>';
const isNum = v => v !== null && v !== undefined && isFinite(Number(v));
const n = (v, d = 2, suf = '') => isNum(v) ? Number(v).toLocaleString('en-IN', {minimumFractionDigits: d, maximumFractionDigits: d}) + suf : null;
const pc = (v, d = 2) => isNum(v) ? (Number(v) >= 0 ? '+' : '') + Number(v).toFixed(d) + '%' : null;
const int = v => isNum(v) ? Math.round(Number(v)).toLocaleString('en-IN') : null;
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Indian money scale. A market cap is read in crore and lakh crore here, not in
   billions — and never rounded to a whole crore, which turned 1,49,22,511 into
   "2 Cr" on an earlier screen. */
function money(v) {
  if (!isNum(v)) return null;
  const a = Math.abs(Number(v));
  if (a >= 1e12) return '₹' + (v / 1e12).toFixed(2) + ' L Cr';
  if (a >= 1e7)  return '₹' + (v / 1e7).toFixed(2) + ' Cr';
  if (a >= 1e5)  return '₹' + (v / 1e5).toFixed(2) + ' L';
  return '₹' + Number(v).toLocaleString('en-IN');
}
const vol = v => { if (!isNum(v)) return null; const a = Math.abs(v);
  return a >= 1e7 ? (v/1e7).toFixed(2) + ' Cr' : a >= 1e5 ? (v/1e5).toFixed(2) + ' L' : int(v); };

/* One key/value row. `raw` may legitimately be 0 — the check is on null. */
const row = (k, raw, cls) => `<div class="k">${esc(k)}</div><div class="v ${raw === null || raw === undefined ? 'na' : (cls||'')}">${raw === null || raw === undefined ? 'not reported' : raw}</div>`;
const kv = rows => `<div class="kv">${rows.join('')}</div>`;
const card = (title, inner, tag) =>
  `<div class="card"><h3>${esc(title)}${tag ? `<span class="tag">${esc(tag)}</span>` : ''}</h3>${inner}</div>`;

/* A position bar: low ─●─ high. Returns a plain message when the band is
   unknown, rather than a bar with the dot parked at zero. */
function rangeBar(label, lo, hi, at, caption) {
  if (!isNum(lo) || !isNum(hi) || hi <= lo || !isNum(at)) {
    return `<div class="bl"><span>${esc(label)}</span></div><div class="cap">${NA}</div>`;
  }
  const p = Math.min(100, Math.max(0, (at - lo) / (hi - lo) * 100));
  return `<div class="bl"><span>${n(lo)}</span><span style="color:var(--text)">${esc(label)}</span><span>${n(hi)}</span></div>
    <div class="tr"><span class="dot" style="left:${p}%"></span></div>
    <div class="cap">${p.toFixed(0)}% of the band${caption ? ' · ' + esc(caption) : ''}</div>`;
}

/* ── load ─────────────────────────────────────────────────────────────────── */
function stockUrl(q) {
  const p = new URLSearchParams();
  if (q) p.set('q', q);
  if (TAB !== 'overview') p.set('tab', TAB);
  return '/stock.html' + (p.toString() ? '?' + p.toString() : '');
}
function go(e) { if (e) e.preventDefault(); const q = document.getElementById('q').value.trim();
  if (q) { history.replaceState(null, '', stockUrl(q)); load(q); } }

async function load(q) {
  const msg = document.getElementById('msg'), shell = document.getElementById('shell');
  msg.className = 'msg'; msg.textContent = 'fetching live market, fundamentals, technicals and news for "' + q + '"…';
  msg.classList.remove('hidden'); shell.classList.add('hidden');
  try {
    const r = await (await fetch(`${API}/api/agents/stock?q=${encodeURIComponent(q)}&deep=1`, {cache:'no-store'})).json();
    if (!r.ok) { msg.className = 'msg err'; msg.innerHTML = '⚠️ ' + esc(r.error || 'lookup failed'); return; }
    DATA = r;
    msg.classList.add('hidden'); shell.classList.remove('hidden');
    header(); render();
    document.title = (r.quote?.name || r.symbol) + ' · Stock View';
    document.getElementById('stale').textContent = 'as of ' + new Date(r.generatedAt).toLocaleTimeString('en-IN');
  } catch (err) {
    msg.className = 'msg err'; msg.innerHTML = '⚠️ ' + esc(err.message) + ' — is the server running?';
  }
}

function header() {

function perfTable() {

/* The corporate-action banner. This is the difference between a blank that looks
   like a bug and a blank that is the answer. */
function breakNote(b) {
  return `<div class="note" style="color:#f0dcae"><b>Why some periods are blank:</b> ${esc(b.note)}
    Only <b>${b.usableBars}</b> trading days since ${esc(b.on)} are comparable with today's price.</div>`;
}

/* ── HIGH/LOW MAP ────────────────────────────────────────────────────────── */
function bandMap(label, low, now, high, source) {
  const lo = isNum(low) ? Number(low) : null, at = isNum(now) ? Number(now) : null, hi = isNum(high) ? Number(high) : null;
  if (lo === null || at === null || hi === null || hi <= lo) {
    return `<div class="hlBox"><h4>${esc(label)}</h4><div class="prose">${NA}</div><div class="hlStatus">Cannot map this band until low, current and high are all reported.</div></div>`;
  }
  const rawPct = ((at - lo) / (hi - lo)) * 100;
  const pct = Math.min(100, Math.max(0, rawPct));
  const fromLow = at >= lo ? at - lo : 0;
  const fromHigh = hi >= at ? hi - at : 0;
  const outside = at < lo ? `Below reported low by ${n(lo - at)}` : at > hi ? `Above reported high by ${n(at - hi)}` : null;
  const status = outside || `${pct.toFixed(1)}% position between low and high`;
  return `<div class="hlBox">
    <h4>${esc(label)}</h4>
    <div class="hlRail">
      <div class="hlLine"></div>
      <span class="hlMark low">LOW</span><span class="hlMark high">HIGH</span>
      <span class="hlNow" style="left:${pct}%"></span>
    </div>
    <div class="hlMeta">
      <span>Low</span><b>${n(lo)}</b>
      <span>Current</span><b>${n(at)}</b>
      <span>High</span><b>${n(hi)}</b>
      <span>From low</span><b>${n(fromLow)} · ${Math.max(0, rawPct).toFixed(1)}%</b>
      <span>From high</span><b>${n(fromHigh)} · ${Math.max(0, 100 - rawPct).toFixed(1)}%</b>
    </div>
    <div class="hlStatus ${outside ? 'warn' : ''}">${esc(status)} · ${esc(source)}</div>
  </div>`;
}

function highLowMap() {
  const q = DATA.quote || {}, t = DATA.technicals;
  const rg = t && t.ok ? t.range || {} : {};
  return `<div class="banner"><b>High/Low mapping rule:</b> LOW = left edge, CURRENT = white marker, HIGH = right edge. If live price is outside the vendor band, marker stays on the edge and the warning says exactly how far outside it is.</div>
  <div class="hlGrid">
    ${bandMap('Today intraday', q.dayLow, q.price, q.dayHigh, 'quote feed intraday')}
    ${bandMap('52-week vendor', q.wk52Low, q.price, q.wk52High, 'vendor intraday extremes')}
    ${bandMap('52-week computed', rg.low52w, q.price, rg.high52w, 'daily close, corporate-action comparable window')}
  </div>
  <div class="cols c2" style="margin-top:12px">
    ${card('Mapping verification', kv([
      row('Day low present', isNum(q.dayLow) ? 'yes' : null),
      row('Day high present', isNum(q.dayHigh) ? 'yes' : null),
      row('52w vendor low/high', isNum(q.wk52Low) && isNum(q.wk52High) ? 'yes' : null),
      row('Computed range block', t && t.ok ? 'yes' : null),
      row('Current price source', isNum(q.price) ? 'quote feed' : null),
    ]) + `<div class="note">Vendor 52-week and computed 52-week can differ: vendor uses intraday extremes; computed uses daily closes after corporate-action filtering.</div>`, 'verified')}
    ${card('Exact distances', kv([
      row('Today: current - low', isNum(q.price) && isNum(q.dayLow) ? n(q.price - q.dayLow) : null),
      row('Today: high - current', isNum(q.dayHigh) && isNum(q.price) ? n(q.dayHigh - q.price) : null),
      row('Vendor 52w: current - low', isNum(q.price) && isNum(q.wk52Low) ? n(q.price - q.wk52Low) : null),
      row('Vendor 52w: high - current', isNum(q.wk52High) && isNum(q.price) ? n(q.wk52High - q.price) : null),
    ]) + `<div class="note">Negative distance means current price moved outside the reported band; it is shown as a data-timing warning in the map, not hidden.</div>`, 'math')}
  </div>`;
}

/* ── TECHNICAL ────────────────────────────────────────────────────────────── */
function technical() {
  const t = DATA.technicals;
  if (!t || !t.ok) return `<div class="msg">${t && t.reason ? esc(t.reason) : 'No price history available for this symbol.'}</div>`;
  const ma = t.movingAverages, os = t.oscillators, rg = t.range;

  const banner = t.dataBreak ? `<div class="banner"><b>Corporate action detected.</b> ${esc(t.dataBreak.note)}
    The break was a ${t.dataBreak.movePct}% move on ${esc(t.dataBreak.on)} (${n(t.dataBreak.from)} → ${n(t.dataBreak.to)}).
    <b>${t.dataBreak.usableBars}</b> of ${t.bars} bars are usable.</div>` : '';

  const trendCls = t.trend.label === 'UP' ? 'up' : t.trend.label === 'DOWN' ? 'dn' : 'warn';

  return banner + `<div class="cols c3">
    ${card('Moving averages', kv([
      row('SMA 20', n(ma.sma20)), row('SMA 50', n(ma.sma50)), row('SMA 200', n(ma.sma200)),
      row('EMA 20', n(ma.ema20)), row('EMA 50', n(ma.ema50)),
      row('Price vs SMA 50', pc(ma.vsSma50Pct), isNum(ma.vsSma50Pct) ? (ma.vsSma50Pct>=0?'up':'dn') : ''),
      row('Price vs SMA 200', pc(ma.vsSma200Pct), isNum(ma.vsSma200Pct) ? (ma.vsSma200Pct>=0?'up':'dn') : ''),
    ]) + `<div style="margin-top:8px"><span class="pill ${trendCls}">TREND ${esc(t.trend.label)}</span>
      <span class="note" style="display:inline;margin-left:6px">on ${t.trend.up} of ${t.trend.of} checks${t.trend.of < 3 ? ' — fewer than three because an average it needs is unavailable' : ''}</span></div>`)}

    ${card('Oscillators', kv([
      row('RSI (14)', isNum(os.rsi14) ? n(os.rsi14) + ' <span class="pill ' + (os.rsiZone==='OVERBOUGHT'?'dn':os.rsiZone==='OVERSOLD'?'up':'') + '">' + esc(os.rsiZone) + '</span>' : null),
      row('MACD', n(os.macd, 3)), row('Signal', n(os.macdSignal, 3)),
      row('Histogram', n(os.macdHistogram, 3), isNum(os.macdHistogram) ? (os.macdHistogram>=0?'up':'dn') : ''),
      row('MACD cross', os.macdCross ? `<span class="pill ${os.macdCross==='BULLISH'?'up':'dn'}">${esc(os.macdCross)}</span>` : null),
    ]) + `<div class="note">RSI is Wilder's, 14 periods; 70 and 30 are the conventional bands. MACD is 12/26/9. Both are computed here from ${t.bars} daily bars, not taken from a vendor field.</div>`)}

    ${card('Range and risk', kv([
      row('52-week high', n(rg.high52w)), row('52-week low', n(rg.low52w)),
      row('Position in range', isNum(rg.positionPct) ? rg.positionPct + '%' : null),
      row('ATR (14)', n(rg.atr14)), row('ATR as % of price', pc(rg.atrPct)),
      row('Volatility (30d, annualised)', pc(rg.volatility30d, 1)),
    ]) + `<div class="note">This 52-week band is built from daily <b>closes</b> in the usable window. The vendor's band in the header uses intraday extremes over a fixed year — the two disagreeing is expected, not a fault.</div>`)}
  </div>

  <div class="cols c2" style="margin-top:10px">
    ${card('Performance', perfTable())}
    ${card('Volume', kv([
      row('Last session', vol(t.volume.last)),
      row('20-day average', vol(t.volume.avg20)),
      row('Ratio to average', isNum(t.volume.ratio) ? t.volume.ratio + '×' : null, isNum(t.volume.ratio) ? (t.volume.ratio>=1?'up':'') : ''),
    ]) + `<div class="note">Computed from ${t.bars} bars ending ${esc(t.asOf || 'the last session')}.</div>`)}
  </div>`;
}

/* ── FUNDAMENTAL ──────────────────────────────────────────────────────────── */
function fundamental() {
  const f = DATA.fundamentals;
  if (!f) return `<div class="msg">Fundamentals were not returned for this symbol.</div>`;
  const val = f.valuation||{}, ps = f.perShare||{}, rt = f.returns||{}, gr = f.growth||{},
        bal = f.balance||{}, dv = f.dividend||{}, sh = f.shares||{};

  const yearly = (f.yearly||[]).length ? `<table><thead><tr><th>Year</th><th>Revenue</th><th>Profit</th></tr></thead><tbody>${
    f.yearly.map(r => `<tr><td>${esc(r.period)}</td><td>${money(r.revenue) ?? '—'}</td><td>${money(r.profit) ?? '—'}</td></tr>`).join('')
  }</tbody></table>` : `<div class="prose">${NA}</div>`;

  const quarterly = (f.quarterly||[]).length ? `<table><thead><tr><th>Quarter</th><th>Revenue</th><th>Profit</th></tr></thead><tbody>${
    f.quarterly.map(r => `<tr><td>${esc(r.period)}</td><td>${money(r.revenue) ?? '—'}</td><td>${money(r.profit) ?? '—'}</td></tr>`).join('')
  }</tbody></table>` : `<div class="prose">${NA}</div>`;

  const eps = (f.quarterlyEps||[]).length ? `<table><thead><tr><th>Quarter</th><th>EPS</th><th>Estimate</th><th>Beat</th></tr></thead><tbody>${
    f.quarterlyEps.map(r => { const beat = isNum(r.eps) && isNum(r.estimate) ? r.eps - r.estimate : null;
      return `<tr><td>${esc(r.period)}</td><td>${n(r.eps)}</td><td>${n(r.estimate) ?? '—'}</td><td class="${beat===null?'':(beat>=0?'up':'dn')}">${beat===null?'—':(beat>=0?'+':'')+beat.toFixed(2)}</td></tr>`;
    }).join('')
  }</tbody></table>` : `<div class="prose">${NA}</div>`;

  return `<div class="cols c3">
    ${card('Valuation', kv([
      row('Market cap', money(val.marketCap)), row('Enterprise value', money(val.enterpriseValue)),
      row('P/E trailing', n(val.peTrailing)), row('P/E forward', n(val.peForward)),
      row('PEG', n(val.peg)), row('Price to book', n(val.priceToBook)),
      row('Price to sales', n(val.priceToSales)),
      row('EV / revenue', n(val.evToRevenue)), row('EV / EBITDA', n(val.evToEbitda)),
    ]))}
    ${card('Per share', kv([
      row('EPS trailing', n(ps.eps)), row('EPS forward', n(ps.epsForward)),
      row('Book value', n(ps.bookValue)), row('Revenue per share', n(ps.revenuePerShare)),
      row('Cash per share', n(ps.cashPerShare)),
      row('Shares outstanding', vol(sh.outstanding)), row('Free float', vol(sh.float)),
      row('Last split', sh.lastSplitFactor ? esc(sh.lastSplitFactor) + (sh.lastSplitDate ? ' · ' + esc(sh.lastSplitDate) : '') : null),
    ]))}
    ${card('Returns and margins', kv([
      row('ROE (reported)', pc(rt.roe)),
      row('ROE (derived)', isNum(rt.roeDerived) ? pc(rt.roeDerived) + ' <span class="pill warn">derived</span>' : null),
      row('ROA', pc(rt.roa)), row('Net profit margin', pc(rt.profitMargin)),
      row('Operating margin', pc(rt.operatingMargin)),
      row('Gross margin', pc(rt.grossMargin)), row('EBITDA margin', pc(rt.ebitdaMargin)),
    ]) + `<div class="note"><b>Derived</b> ROE is EPS ÷ book value — arithmetic from two reported figures, offered when the source publishes no ROE, and never merged with a reported one. Banks routinely report no gross or EBITDA margin; that blank is the source's silence, not a zero.</div>`)}
  </div>

  <div class="cols c3" style="margin-top:10px">
    ${card('Growth', kv([
      row('Revenue growth', pc(gr.revenue), isNum(gr.revenue)?(gr.revenue>=0?'up':'dn'):''),
      row('Earnings growth', pc(gr.earnings), isNum(gr.earnings)?(gr.earnings>=0?'up':'dn'):''),
      row('52-week change', pc(gr.change52w), isNum(gr.change52w)?(gr.change52w>=0?'up':'dn'):''),
      row('Index over the same year', pc(gr.changeIndex52w)),

    ${card('Balance sheet', kv([
      row('Total revenue', money(bal.totalRevenue)), row('Gross profit', money(bal.grossProfit)),
      row('EBITDA', money(bal.ebitda)), row('Net income', money(bal.netIncome)),
      row('Total cash', money(bal.totalCash)), row('Total debt', money(bal.totalDebt)),
      row('Debt to equity', n(bal.debtToEquity)),
      row('Current ratio', n(bal.currentRatio)), row('Quick ratio', n(bal.quickRatio)),
      row('Operating cash flow', money(bal.operatingCashflow)), row('Free cash flow', money(bal.freeCashflow)),
    ]))}
    ${card('Dividend', kv([
      row('Indicated rate', n(dv.rate)), row('Yield', pc(dv.yield)),
      row('Payout ratio', pc(dv.payoutRatio)), row('5-year average yield', n(dv.fiveYearAvgYield)),
      row('Last dividend', isNum(dv.lastValue) ? n(dv.lastValue) + (dv.lastDate ? ' · ' + esc(dv.lastDate) : '') : null),
      row('Ex-dividend date', dv.exDate ? esc(dv.exDate) : null),
    ]) + `<div class="note">The <b>indicated</b> rate, not the trailing one: a company that has declared a dividend but not yet paid a full year of them shows a trailing 0, which would read as paying nothing.</div>`)}
  </div>

  <div class="cols c3" style="margin-top:10px">
    ${card('Yearly results', yearly, f.currency || 'INR')}
    ${card('Quarterly results', quarterly, f.currency || 'INR')}
    ${card('Quarterly EPS vs estimate', eps)}

}

/* ── OWNERSHIP & ANALYSTS ─────────────────────────────────────────────────── */
function ownership() {
  const f = DATA.fundamentals || {}, d = f.deep || {};
  const h = d.holders, at = d.analystTrend, ia = d.insiderActivity, an = f.analysts || {}, ol = d.earningsOutlook;

  const holders = h ? kv([
    row('Insiders / promoter-like', pc(h.insidersPct)),
    row('Institutions', pc(h.institutionsPct)),
    row('Institutions as % of float', pc(h.institutionsOfFloatPct)),
    row('Institutional holders', int(h.institutionsCount)),
    row('Unclassified remainder', isNum(h.insidersPct) && isNum(h.institutionsPct) ? pc(100 - h.insidersPct - h.institutionsPct) : null),
  ]) + `<div class="note">${esc(h.note)} The remainder is shown rather than hidden, because the parts do not sum to 100 and a reader is entitled to see that.</div>`
    : `<div class="prose">${NA}</div>`;

  /* The buy/hold/sell bar. Segments narrower than 6% carry no label rather than
     overflowing it into a neighbour. */
  let dist = `<div class="prose">${NA}</div>`;
  if (at) {
    const seg = [['Strong buy','strongBuy','#1f9e6f'],['Buy','buy','#26d0a0'],['Hold','hold','#ffc24b'],['Sell','sell','#ff8a5c'],['Strong sell','strongSell','#ff5470']];
    dist = `<div class="dist">${seg.map(([lbl,k,c]) => { const w = at[k] / at.total * 100;
        return w > 0 ? `<span style="width:${w}%;background:${c}">${w >= 6 ? at[k] : ''}</span>` : ''; }).join('')}</div>
      <div class="dlg">${seg.map(([lbl,k,c]) => `<span><i style="background:${c}"></i>${lbl} ${at[k]}</span>`).join('')}</div>
      <div class="note">${at.total} published ratings. ${esc(at.note)} — nothing in this system acts on them.</div>`;
  }

  const targets = kv([
    row('Consensus view', an.recommendation ? esc(String(an.recommendation).toUpperCase()) : null),
    row('Mean score', n(an.mean)), row('Analysts covering', int(an.count)),
    row('Target low', n(an.targetLow)), row('Target mean', n(an.targetMean)),
    row('Target median', n(an.targetMedian)), row('Target high', n(an.targetHigh)),
  ]) + `<div class="note">Price targets are <b>opinion published by banks</b>. They are shown because a broker screen shows them, and they carry no more standing here than a headline.</div>`;

  const insider = (ia && ia.reported) ? kv([
    row('Net 6-month shares', int(ia.netSixMonthShares)),
    row('Net 6-month % of insider holding', pc(ia.netSixMonthPct)),
    row('Bought', int(ia.boughtShares)), row('Sold', int(ia.soldShares)),
    row('Filings listed', int(ia.rows.length)),
  ]) + (ia.rows.length ? `<table style="margin-top:6px"><thead><tr><th>Holder</th><th>Transaction</th><th>Date</th></tr></thead><tbody>${
      ia.rows.slice(0,6).map(r => `<tr><td>${esc(r.name)}</td><td>${esc(r.transaction || '—')}</td><td>${esc(r.date || '—')}</td></tr>`).join('')
    }</tbody></table>` : '')
    : `<div class="prose">No insider filings reported.</div><div class="note">${esc(ia?.note || '')}</div>`;

  const outlook = ol ? `<table><thead><tr><th>Period</th><th>EPS est.</th><th>Growth</th><th>Revenue est.</th><th>Analysts</th></tr></thead><tbody>${
    ol.map(r => `<tr><td>${esc(r.period)}</td><td>${n(r.epsEstimate) ?? '—'}</td>
      <td class="${isNum(r.epsGrowthPct)?(r.epsGrowthPct>=0?'up':'dn'):''}">${pc(r.epsGrowthPct) ?? '—'}</td>
      <td>${money(r.revenueEstimate) ?? '—'}</td><td>${int(r.analysts) ?? '—'}</td></tr>`).join('')
  }</tbody></table><div class="note">Consensus <b>forecasts</b>, not results. 0q and 0y are the current quarter and year; +1q and +1y are the next.</div>`
    : `<div class="prose">${NA}</div>`;

  const peers = (DATA.peers && DATA.peers.length)
    ? `<div class="chips">${DATA.peers.map(p => `<span class="chip" onclick="openStock('${esc(p.symbol)}')">${esc(p.symbol)}</span>`).join('')}</div>
       <div class="note">The vendor's "people also viewed" list, not a sector-matched peer set. Click one to open it.</div>`
    : `<div class="prose">${NA}</div>`;

  return `<div class="cols c3">
    ${card('Shareholding', holders, 'vendor split')}
    ${card('Analyst ratings', dist, 'opinion')}
    ${card('Price targets', targets, 'opinion')}
  </div>
  <div class="cols c3" style="margin-top:10px">
    ${card('Insider activity', insider)}
    ${card('Forward estimates', outlook, 'forecast')}
    ${card('Similar stocks', peers)}
  </div>`;
}

/* ── LINKED CHAIN ────────────────────────────────────────────────────────── */
function linkModel() {
  const q = DATA.quote || {}, f = DATA.fundamentals || {}, d = f.deep || {}, prof = d.profile || {};
  const peers = (DATA.peers || []).slice(0, 7).map((p, i) => ({
    type: 'Peer',
    symbol: String(p.symbol || '').toUpperCase(),
    name: p.yahooSymbol || p.symbol,
    strength: isNum(p.score) ? Number(p.score).toFixed(2) : (100 - i * 9) + '%',
      note: 'vendor similar-stock chain'
  })).filter(x => x.symbol);

  const newsLinks = [];
  for (const h of (DATA.headlines || [])) {
    if (!h.title) continue;
    newsLinks.push({
      type: h.sentiment ? String(h.sentiment).toUpperCase() : 'News',
      symbol: DATA.symbol,
      name: h.title,
      strength: h.at ? new Date(h.at).toLocaleDateString('en-IN') : '48h',
      note: h.source || 'headline'
    });
  }
  for (const d0 of (DATA.dealImpacts || [])) {
    newsLinks.push({
      type: d0.direction || 'Deal',
      symbol: DATA.symbol,
      name: d0.title || d0.type || 'deal-class event',
      strength: isNum(d0.probability) ? d0.probability + '% heuristic' : 'model',
      note: d0.type || 'event'
    });
  }

  const groups = [
    prof.sector || DATA.sector ? { type:'Sector', symbol:DATA.symbol, name:prof.sector || DATA.sector, strength:'same group', note:'profile classification' } : null,
    prof.industry ? { type:'Industry', symbol:DATA.symbol, name:prof.industry, strength:'same chain', note:'vendor industry' } : null,
    q.marketState ? { type:'Market', symbol:DATA.symbol, name:q.marketState, strength:'state', note:'quote feed' } : null,
  ].filter(Boolean);

  return { peers, newsLinks: newsLinks.slice(0, 7), groups };
}

function linked() {
  const m = linkModel();
  const total = m.peers.length + m.newsLinks.length + m.groups.length;
  const all = [...m.peers, ...m.groups, ...m.newsLinks];
  const nodes = [
    { cls:'main', symbol:DATA.symbol, label:(DATA.quote?.name || DATA.symbol), x:50, y:50, open:true },
    ...m.peers.map((p, i) => {
      const a = -145 + i * (290 / Math.max(1, m.peers.length - 1));
      return { symbol:p.symbol, label:p.name, x:50 + Math.cos(a*Math.PI/180)*34, y:50 + Math.sin(a*Math.PI/180)*34, open:true };
    }),
    ...m.groups.map((g, i) => ({ symbol:g.type, label:g.name, x:18 + i*32, y:18, open:false })),
    ...m.newsLinks.slice(0, 3).map((n0, i) => ({ symbol:n0.type, label:n0.note, x:22 + i*28, y:84, open:false }))
  ];
  const lines = nodes.slice(1).map(n0 => `<line x1="50%" y1="50%" x2="${n0.x}%" y2="${n0.y}%" stroke="rgba(58,208,224,.34)" stroke-width="1.4" />`).join('');
  const nodeHtml = nodes.map(n0 => `<button class="node ${n0.cls||''}" style="left:${n0.x}%;top:${n0.y}%" ${n0.open ? `onclick="openStock('${esc(n0.symbol)}')"` : ''}>
      <b>${esc(n0.symbol)}</b><span>${esc(String(n0.label || '').slice(0, 28))}</span>
    </button>`).join('');

  const rows = all.length ? all.map(x => `<div class="linkRow" onclick="openStock('${esc(x.symbol)}')">
      <b>${esc(x.symbol)}</b><span>${esc(x.name)}</span><em>${esc(x.type)} · ${esc(x.strength)}</em>
    </div>`).join('') : `<div class="prose">No connected peer/news chain was returned for this symbol.</div>`;

  return `<div class="linkHero">
    ${card('Linked stock map', `
      <div class="prose">Ek stock ko akela nahi, uske connected peer, sector, industry, headline aur deal chain ke saath dekho. Peer nodes click karne se woh stock open hota hai.</div>
      <div class="chainStats">
        <div class="miniStat"><span>Connections</span><b>${int(total) ?? 0}</b></div>
        <div class="miniStat"><span>Peers</span><b>${int(m.peers.length) ?? 0}</b></div>
        <div class="miniStat"><span>Events</span><b>${int(m.newsLinks.length) ?? 0}</b></div>
      </div>
      <div class="note">Peer list vendor similar-stock/opinion feed se aati hai; sector/industry profile se; news chain local feed se. Blank relation ko forced connection nahi banaya gaya.</div>`, 'chain')}
    <div class="card network">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${lines}</svg>
      ${nodeHtml}
    </div>
  </div>
  <div class="cols c2" style="margin-top:12px">
    ${card('Connected rows', `<div class="linkList">${rows}</div>`, 'clickable')}
    ${card('Chain read', kv([
      row('Primary stock', esc(DATA.symbol)),
      row('Sector link', m.groups.find(x => x.type === 'Sector')?.name ? esc(m.groups.find(x => x.type === 'Sector').name) : null),
      row('Industry link', m.groups.find(x => x.type === 'Industry')?.name ? esc(m.groups.find(x => x.type === 'Industry').name) : null),
      row('Similar stocks', int(m.peers.length)),
      row('News/deal links', int(m.newsLinks.length)),
    ]) + `<div class="note">This is a relationship view, not a correlation engine. It shows what the returned data can honestly connect right now.</div>`)}
  </div>`;
}

/* ── COMPANY INSIDE ─────────────────────────────────────────────────────────
   This tab separates verified company facts from guessed context. A box is
   marked ready only when the deep payload contains the field that supports it. */
function companyInside() {
  const f = DATA.fundamentals || {}, d = f.deep || {}, p = d.profile || {};
  const ev = d.events || {}, h = d.holders || {}, ia = d.insiderActivity || {};
  const gov = p.governance || {}, an = f.analysts || {};
  const hs = DATA.headlines || [], deals = DATA.dealImpacts || [];
  const checks = [
    { label:'Company profile', ok:!!(p.sector || p.industry || p.summary), text:[p.sector, p.industry].filter(Boolean).join(' · ') || 'profile not reported' },
    { label:'Result date', ok:!!ev.nextEarnings, wait:!!ev.nextEarningsIsEstimate, text:ev.nextEarnings ? (ev.nextEarningsIsEstimate ? 'estimated ' : 'confirmed ') + ev.nextEarnings : 'not reported' },
    { label:'Dividend action', ok:!!(ev.exDividend || f.dividend?.exDate || f.dividend?.lastDate), text:ev.exDividend || f.dividend?.exDate || f.dividend?.lastDate || 'not reported' },
    { label:'Insider filings', ok:!!(ia.reported || (ia.rows || []).length), text:ia.reported ? `${int((ia.rows || []).length) ?? 0} filings available` : 'no filings reported' },
    { label:'Shareholding split', ok:!!h.note || isNum(h.insidersPct) || isNum(h.institutionsPct), text:isNum(h.institutionsPct) ? `institutions ${pc(h.institutionsPct)}` : 'not reported' },
    { label:'Governance scores', ok:Object.values(gov).some(isNum), text:Object.values(gov).some(isNum) ? 'vendor risk scores present' : 'not reported' },
    { label:'Analyst coverage', ok:isNum(an.count) && an.count > 0, text:isNum(an.count) ? `${int(an.count)} analysts` : 'not reported' },
    { label:'News cross-check', ok:hs.length > 0 || deals.length > 0, text:`${int(hs.length) ?? 0} headlines · ${int(deals.length) ?? 0} deal events` },
  ];
  const ready = checks.filter(x => x.ok && !x.wait).length;
  const pending = checks.filter(x => !x.ok || x.wait).length;
  const boxes = checks.map(x => `<div class="verifyBox ${x.ok && !x.wait ? 'ok' : x.wait ? 'wait' : 'no'}">
      <b>${esc(x.ok && !x.wait ? 'Verified' : x.wait ? 'Needs confirmation' : 'Not reported')} · ${esc(x.label)}</b>
      <span>${esc(x.text)}</span>
    </div>`).join('');

  const upcoming = kv([
    row('Next results', ev.nextEarnings ? esc(ev.nextEarnings) + (ev.nextEarningsIsEstimate ? ' <span class="pill warn">estimate</span>' : ' <span class="pill up">verified</span>') : null),
    row('EPS estimate', n(ev.epsEstimate)),
    row('Revenue estimate', money(ev.revenueEstimate)),
    row('Ex-dividend', ev.exDividend ? esc(ev.exDividend) : null),
    row('Dividend pay date', ev.dividendPay ? esc(ev.dividendPay) : null),
    row('Last earnings call', ev.lastEarningsCall ? esc(ev.lastEarningsCall) : null),
  ]);

  const insider = (ia.reported || (ia.rows || []).length) ? kv([
    row('Net 6-month shares', int(ia.netSixMonthShares)),
    row('Bought', int(ia.boughtShares)),
    row('Sold', int(ia.soldShares)),
    row('Filings listed', int((ia.rows || []).length)),
  ]) : `<div class="prose">No verified insider filing feed was returned for this symbol.</div>`;

  return `<div class="cols c2">
    ${card('Inside readiness', `
      <div class="verifyHead"><div class="prose">Company ke andar ke facts tabhi ready count hote hain jab payload me supporting field aaya ho. Estimated result date ko verified nahi maana gaya.</div><div class="score">${ready}<small>/${checks.length}</small></div></div>
      <div class="verifyGrid">${boxes}</div>
      <div class="note">${pending} items still need source confirmation or were not reported by the vendor.</div>`, 'verified')}
    ${card('Upcoming company actions', upcoming, 'events')}
  </div>
  <div class="cols c2" style="margin-top:12px">
    ${card('Insider and holding feed', insider, ia.reported ? 'filings' : 'limited')}
    ${card('Company identity proof', kv([
      row('Legal/profile name', p.longName ? esc(p.longName) : (DATA.quote?.name ? esc(DATA.quote.name) : null)),
      row('Sector', p.sector ? esc(p.sector) : null),
      row('Industry', p.industry ? esc(p.industry) : null),
      row('Employees', int(p.employees)),
      row('Website', p.website ? `<a href="${esc(p.website)}" target="_blank" rel="noopener">${esc(p.website.replace(/^https?:\/\//,''))}</a>` : null),
    ]) + `<div class="note">This section is a verification surface. Missing values remain not reported, never converted into zero or a confident claim.</div>`, 'profile')}
  </div>`;
}

/* ── autocomplete ────────────────────────────────────────────────────────────
   Opens on the first character typed. Every entry comes from the broker's own
   instrument master — 5,798 listed NSE and BSE symbols — searched in memory on
   the server, so a keystroke costs nothing at the broker.

   Keyboard first: ↓ ↑ to move, Enter to open, Esc to dismiss. A dropdown you can
   only click is a dropdown that slows down the person who knows what they want. */
const acEl = document.getElementById('ac');
const qEl = document.getElementById('q');
let acRows = [], acSel = -1, acSeq = 0;

function acClose() {
  acEl.classList.remove('on');
  acEl.parentElement.setAttribute('aria-expanded', 'false');
  acRows = []; acSel = -1;
}

function acPaint(d) {
  acRows = d.results || [];
  acSel = -1;
  if (!d.ok) {
    // A universe that was never built says so, with the command that fixes it.
    // An empty list here would claim no such stock is listed in India.
    acEl.innerHTML = `<div class="ac-none">${esc(d.error || 'search unavailable')}</div>`;
  } else if (!acRows.length) {
    acEl.innerHTML = `<div class="ac-none">no listed stock matches “${esc(d.query)}”</div>`;
  } else {
    acEl.innerHTML = acRows.map((r, i) => `<div class="ac-i" role="option" data-i="${i}" aria-selected="false">
        <span class="ac-s">${esc(r.symbol)}</span>
        <span class="ac-n">${esc(r.name)}</span>
        ${r.fno ? '<span class="ac-fo">F&amp;O</span>' : ''}
        <span class="ac-e">${esc(r.exchange)}</span>
      </div>`).join('')
      // The count is the FULL match count, not the number shown. "20 of 38" and
      // "20" are different statements and only one of them is true.
      + (d.total > acRows.length ? `<div class="ac-more">showing ${acRows.length} of ${d.total} matches — keep typing to narrow</div>` : '');
  }
  acEl.classList.add('on');
  acEl.parentElement.setAttribute('aria-expanded', 'true');
}

function acMove(step) {
  if (!acRows.length) return;
  acSel = (acSel + step + acRows.length) % acRows.length;
  [...acEl.querySelectorAll('.ac-i')].forEach((el, i) => {
    el.classList.toggle('sel', i === acSel);
    el.setAttribute('aria-selected', i === acSel ? 'true' : 'false');
    if (i === acSel) el.scrollIntoView({ block: 'nearest' });
  });
}

async function acSearch(term) {
  const seq = ++acSeq;
  try {
    const d = await (await fetch(`${API}/api/stock/search?q=${encodeURIComponent(term)}&limit=20`, { cache: 'no-store' })).json();
    // Out-of-order replies would otherwise repaint the list for a query the
    // reader has already typed past.
    if (seq !== acSeq) return;
    acPaint(d);
  } catch (e) {
    if (seq !== acSeq) return;
    acEl.innerHTML = `<div class="ac-none">search unreachable — ${esc(e.message)}</div>`;
    acEl.classList.add('on');
  }
}

qEl.addEventListener('input', () => {
  const t = qEl.value.trim();
  if (!t) { acClose(); return; }
  acSearch(t);
});

qEl.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { e.preventDefault(); acMove(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acMove(-1); }
  else if (e.key === 'Escape') { acClose(); }
  else if (e.key === 'Enter' && acSel >= 0 && acRows[acSel]) {
    e.preventDefault();
    openStock(acRows[acSel].symbol);
  }
});

acEl.addEventListener('mousedown', (e) => {
  // mousedown, not click: the input's blur would close the list first.
  const row = e.target.closest('.ac-i');
  if (!row) return;
  e.preventDefault();
  const r = acRows[Number(row.dataset.i)];
  if (r) openStock(r.symbol);
});

qEl.addEventListener('blur', () => setTimeout(acClose, 120));
qEl.addEventListener('focus', () => { if (qEl.value.trim()) acSearch(qEl.value.trim()); });

const q0 = new URLSearchParams(location.search).get('q');
if (q0) { document.getElementById('q').value = q0; load(q0); }
else {
  if (TAB === 'propicks') {
    document.getElementById('msg').innerHTML = 'Type an Indian stock above to open the <b>ProPicks research</b> tab. Example: <code>TCS</code>.';
  }
  document.getElementById('q').focus();
}
</script>
