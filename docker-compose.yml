# Antigravity Pro — app + redis. Secrets come from .env at runtime (never baked in).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env            # UPSTOX_ACCESS_TOKEN, AUTH_* etc. (local, gitignored)
    volumes:
      # Mutable runtime state. NOT baked into the image — .dockerignore excludes `data`.
      # A BIND mount, not a named volume: data/config-overrides.json carries
      # STRANGLE_ENGINE_ENABLED, STRANGLE_CAPITAL and AI_AGENTS_ENABLED, so an empty
      # named volume would silently start every engine on env defaults. The bind also
      # means the container and a local `node server.js` share one ledger — run only
      # one of them at a time.
      - ./data:/app/data
      # Research datasets: 187 MB, read-only, never copied into the image.
      - ./bt-data:/app/bt-data:ro
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - TRADE_MODE=paper          # never auto-switch to live here
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  redis-data:
