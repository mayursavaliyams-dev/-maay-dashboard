# Antigravity Pro — Nginx reverse proxy + HTTPS + security headers + WS upgrade.
# Put this in /etc/nginx/conf.d/ (or sites-available). Replace your-domain.com and
# the cert paths. Get certs with: certbot --nginx -d your-domain.com

upstream antigravity_app { server 127.0.0.1:3000; keepalive 16; }

# HTTP → HTTPS
server {
    listen 80;
    server_name your-domain.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 4m;

    # fast liveness probe (no logging noise)
    location = /healthz { proxy_pass http://antigravity_app; access_log off; }

    location / {
        proxy_pass http://antigravity_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;          # WebSocket (Dhan WS feed)
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
